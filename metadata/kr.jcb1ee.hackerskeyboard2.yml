Summary: Full 5-row keyboard with Ctrl/Alt keys and Korean Hangul input

Description: |-
  Hacker's Keyboard 2 is a full-featured soft keyboard for power users,
  developers, and anyone who wants a real keyboard on their Android device.

  Features a 5-row layout with a dedicated number row, Ctrl/Alt/Meta modifier
  keys with multi-touch, arrow and navigation keys, and Korean Dubeolsik
  (두벌식) Hangul input with full syllable composition.

  Supports 40+ language layouts including QWERTY, AZERTY, QWERTZ, Dvorak,
  and scripts such as Arabic, Cyrillic, Greek, Hebrew, and Hangul.

  Works great with ConnectBot and Termux. Based on the AOSP Gingerbread
  keyboard, updated for Android 5–14 (API 21–34).

